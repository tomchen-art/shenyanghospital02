		<script>
			// 页面加载完成后执行
			document.addEventListener('DOMContentLoaded', function() {
				// 为所有按钮添加点击效果
				const buttons = document.querySelectorAll('button');
				buttons.forEach(button => {
					button.addEventListener('click', function(e) {
						// 如果是跳转按钮，添加点击波纹效果
						if (this.hasAttribute('onclick') && this.getAttribute('onclick').includes(
								'window.location.href')) {
							// 创建波纹元素
							const ripple = document.createElement('span');
							ripple.classList.add('ripple-effect');

							// 获取点击位置
							const rect = this.getBoundingClientRect();
							const x = e.clientX - rect.left;
							const y = e.clientY - rect.top;

							// 设置波纹位置和大小
							ripple.style.width = ripple.style.height = Math.max(rect.width, rect
								.height) + 'px';
							ripple.style.left = x - (parseInt(ripple.style.width) / 2) + 'px';
							ripple.style.top = y - (parseInt(ripple.style.height) / 2) + 'px';

							// 添加到按钮中
							this.appendChild(ripple);

							// 移除波纹元素
							setTimeout(() => {
								ripple.remove();
							}, 600);
						}
					});
				});

				// 为底部导航项添加点击效果
				const navItems = document.querySelectorAll('.bottom-nav-item');
				navItems.forEach(item => {
					item.addEventListener('click', function() {
						// 移除所有active类
						navItems.forEach(navItem => navItem.classList.remove('active'));
						// 添加active类到当前点击项
						this.classList.add('active');
					});
				});

				// 为返回按钮添加点击效果
				const backButton = document.querySelector('.back-button');
				backButton.addEventListener('click', function() {
					this.classList.add('bg-gray-100');
					setTimeout(() => {
						this.classList.remove('bg-gray-100');
					}, 200);
				});
			});
		</script>
	</body>
