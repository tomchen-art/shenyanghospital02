<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>选择体检日期</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
		<style>
			/* 二、CSS 样式（美化布局） */
			.calendar {
				width: 100vw;
				font-family: "Microsoft Yahei", Arial, sans-serif;
				/* wocao */
				box-sizing: border-box;
			}

			/* 头部导航 */
			.header-nav {
				width: 100vw;
				height: 70px;
				background-color: #fff;
				display: flex;
				justify-content: center;
				align-items: center;
				padding: 0 15px;
				position: relative;
				/* 增加阴影，区分层级 */
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
			}

			.header-nav #ha {
				position: absolute;
				text-decoration: none;
				color: black;
				left: 15px;
				top: 50%;
				transform: translateY(-50%);
				/* 增大箭头点击区域 */
				font-size: 20px;
			}

			.header-nav h1 {
				margin: 0;
				font-size: 20px;
				font-weight: 600;
			}

			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 10px;
			}

			.weekdays,
			.days {
				display: grid;
				grid-template-columns: repeat(7, 1fr);
				gap: 4px;
			}

			.weekdays div,
			.days div {
				height: 40px;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				border: 1px solid #eee;
				border-radius: 4px;
				font-size: 14px;
			}

			.days div {
				cursor: pointer;
			}

			.days div:not(.empty):hover {
				background: #f5f5f5;
			}

			.days div.today {
				background: #ff9900;
				color: white;
				font-weight: bold;
			}

			.days div.empty {
				background: #f9f9f9;
				cursor: default;
			}

			.days div span {
				font-size: 10px;
				color: #999;
				margin-top: 2px;
			}

			#next-step {
				display: block;
				margin: 20px auto;
				padding: 10px 25px;
				background: #008CBA;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-size: 16px;
			}

			a {
				text-decoration: none;
			}
		</style>
	</head>
	<body>

		<div class="calendar">
			<!-- 头部导航 -->
			<div class="header-nav">
				<a href="./setmeal.html" id="ha">
					<i class="fa fa-arrow-left"></i>
				</a>
				<h1>选择体检日期</h1>
			</div>
			<div class="header">
				<h2 id="month-year">2022年1月</h2>
			</div>
			<div class="weekdays">
				<div>日</div>
				<div>一</div>
				<div>二</div>
				<div>三</div>
				<div>四</div>
				<div>五</div>
				<div>六</div>
			</div>
			<div class="days" id="days"></div>
		</div>
		<a href="./confirmorder.html"><button id="next-step">下一步</button></a>


		<script>
			// 三、JavaScript 逻辑（日期计算、渲染、定时更新）

			// 1. 获取东八区当前日期（处理时区）
			function getBeijingDate() {
				const now = new Date();
				const utc = now.getTime() + now.getTimezoneOffset() * 60000; // 转UTC时间
				return new Date(utc + 8 * 3600000); // 东八区=UTC+8
			}

			// 2. 渲染日历（计算当月天数、第一天星期、填充日期）
			function renderCalendar(date) {
				const year = date.getFullYear();
				const month = date.getMonth(); // 月份是0-11（0=1月）
				const firstDay = new Date(year, month, 1).getDay(); // 当月1号是星期几（0=周日）
				const daysInMonth = new Date(year, month + 1, 0).getDate(); // 当月总天数
				const daysElement = document.getElementById('days');
				daysElement.innerHTML = '';

				// 填充“月初空白格”（当月1号之前的星期）
				for (let i = 0; i < firstDay; i++) {
					const emptyDiv = document.createElement('div');
					emptyDiv.className = 'empty';
					daysElement.appendChild(emptyDiv);
				}

				// 填充“当月日期格”
				for (let i = 1; i <= daysInMonth; i++) {
					const dayDiv = document.createElement('div');
					dayDiv.textContent = i;

					// 模拟“余号数”（实际可从接口获取）
					let remain = '余200';
					if (i === 18) remain = '余56';
					else if (i === 19) remain = '余66';
					else if (i === 20) remain = '余123';
					else if (i === 21) remain = '余178';
					else if (i === 22) remain = '余200';
					const remainSpan = document.createElement('span');
					remainSpan.textContent = remain;
					dayDiv.appendChild(remainSpan);

					// 标记“今天”（东八区）
					const today = getBeijingDate();
					if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
						dayDiv.classList.add('today');
					}

					daysElement.appendChild(dayDiv);
				}

				// 更新年月标题
				document.getElementById('month-year').textContent = `${year}年${month + 1}月`;
			}

			// 3. 定时每天凌晨更新日期
			function setupDailyUpdate() {
				const now = getBeijingDate();
				const nextDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0); // 明天0点
				const timeToNextDay = nextDay - now; // 距离明天0点的毫秒数
				setTimeout(() => {
					renderCalendar(getBeijingDate()); // 更新日历
					setupDailyUpdate(); // 循环设置下一次定时
				}, timeToNextDay);
			}

			// 初始化执行
			const initDate = getBeijingDate();
			renderCalendar(initDate);
			setupDailyUpdate();

			// （可选）月份切换功能（如需扩展可保留）
			const prevBtn = document.querySelector('.prev');
			const nextBtn = document.querySelector('.next');
			prevBtn.addEventListener('click', () => {
				const currentDate = new Date(document.getElementById('month-year').textContent);
				currentDate.setMonth(currentDate.getMonth() - 1);
				renderCalendar(currentDate);
			});
			nextBtn.addEventListener('click', () => {
				const currentDate = new Date(document.getElementById('month-year').textContent);
				currentDate.setMonth(currentDate.getMonth() + 1);
				renderCalendar(currentDate);
			});
		</script>
	</body>
</html>
